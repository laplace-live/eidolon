name: Release

# Changesets flow (docs/releasing.md): while changesets exist on master, keep a
# "chore: version packages" PR open. Once it merges, `bun run release` stages
# @laplace.live/eidolon and @laplace.live/eidolon-sdk into their pack/ folders
# and runs `changeset publish`, which publishes unpublished packages to npm via
# OIDC trusted publishing (publishConfig.directory) and tags every release
# including private laplace-eidolon@<version> (firing docker.yml's images).
#
# A GitHub App token (not the default GITHUB_TOKEN) authenticates the action:
# events caused by GITHUB_TOKEN don't start other workflows, so the tag would
# never build, and checks on the version PR would wait for manual approval.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile --ignore-scripts

      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run release
          # No [skip ci]: the version PR runs the full CI, so a bump that breaks a
          # test is caught before it merges.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
          # v2 reads the token only from this input, not from the
          # `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}
