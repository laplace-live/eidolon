name: Relay

on:
  push:
    branches:
      - "master"
    # laplace-eidolon@<version>, pushed by release.yml (changesets) with the
    # release bot's token, so this trigger fires. Tag pushes ignore the path
    # filter, so every release builds.
    tags:
      - "laplace-eidolon@*"
    # Rebuild :edge only when the relay or the manifests/packages it loads
    # change, so bot/persona/web/desktop commits never restart the live relay,
    # while relay commits stay ignored by docker.yml and never restart the bot.
    paths:
      - "apps/relay/**"
      - "!apps/relay/test/**"
      - "packages/subspace/**"
      - "!packages/subspace/test/**"
      - "packages/config/**"
      - "!packages/config/test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "docker-bake.hcl"
      - ".github/workflows/relay.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/relay/**"
      - "!apps/relay/test/**"
      - "packages/subspace/**"
      - "!packages/subspace/test/**"
      - "packages/config/**"
      - "!packages/config/test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "docker-bake.hcl"
      - ".github/workflows/relay.yml"
  repository_dispatch:
    types:
      - webhook
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/laplace-live/eidolon-relay
          tags: |
            type=edge
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=^laplace-eidolon@(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^laplace-eidolon@(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^laplace-eidolon@(\d+)\.\d+\.\d+$,group=1
            type=sha

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build-all
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.dockerfile=apps/relay/Dockerfile
            *.cache-from=type=gha,scope=relay
            *.cache-to=type=gha,mode=max,scope=relay
