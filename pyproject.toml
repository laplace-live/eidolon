[project]
name = "laplace-eidolon"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.10"
dependencies = [
    # SmallWebRTC only — no Daily, no telephony. Self-hosted via Docker
    # behind the user's own reverse proxy / TLS termination.
    "pipecat-ai[fish,mem0,openrouter,runner,silero,soniox,webrtc]",
    # Stream archive + persona facts (RAG over past stream transcripts
    # and hand-compiled fan facts). LanceDB hosts both tables.
    "lancedb>=0.27.1",
    "pyarrow>=22",
    "python-frontmatter>=1.1.0",
    # Hybrid retrieval — Chinese FTS via jieba pre-tokenization (LanceDB
    # 0.30.x has no native CJK tokenizer; we tokenize at ingest + query
    # time and store as a whitespace-separated `tokens` column so
    # Tantivy's `whitespace` base tokenizer indexes it correctly).
    "jieba>=0.42.1",
    # Reranker for hybrid (vector + FTS) results. Pulled in at runtime
    # via lancedb.rerankers.CohereReranker — only used when
    # COHERE_API_KEY is set; falls back to RRF-only if absent.
    "cohere>=5.13.0",
    # Official Model Context Protocol SDK (includes FastMCP). Powers the
    # public Streamable HTTP retrieval server mounted at /mcp.
    "mcp>=1.27.2",
]

[project.optional-dependencies]
# Tooling for local-only operations (transcription, ingest). Not needed at
# runtime by the bot. Install with: uv sync --extra tools
tools = [
    "faster-whisper>=1.2.0",
    "soniox>=1.0.0",
]

# Console-script entry points. Run any of these without `python -m` after
# `uv sync` — they resolve to .venv/bin/laplace-<name> shims pointing at
# the corresponding tool's `main()` function.
#
# The bot is intentionally NOT a console script: Pipecat's runner
# discovers the `bot()` function via `sys.modules["__main__"]`, which a
# console-script entry doesn't satisfy. Invoke the bot via
# `uv run python -m laplace_eidolon.bot` instead.
[project.scripts]
laplace-refine          = "laplace_eidolon.tools.refine:main"
laplace-ingest-streams  = "laplace_eidolon.tools.ingest_streams:main"
laplace-ingest-facts    = "laplace_eidolon.tools.ingest_facts:main"
laplace-search          = "laplace_eidolon.tools.search:main"
laplace-pipeline        = "laplace_eidolon.tools.pipeline:main"
laplace-download        = "laplace_eidolon.tools.download:main"
laplace-transcribe      = "laplace_eidolon.tools.transcribe:main"
laplace-extract-users   = "laplace_eidolon.tools.extract_users:main"
laplace-eval-retrieval  = "laplace_eidolon.tools.eval_retrieval:main"

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=8.0,<9",
    "ruff>=0.12.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Hatchling needs an explicit packages= list because the distribution
# name (``laplace-eidolon``, hyphen) doesn't match the import name
# (``laplace_eidolon``, underscore). Without this, auto-discovery fails
# at install time with "Unable to determine which files to ship".
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laplace_eidolon"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
