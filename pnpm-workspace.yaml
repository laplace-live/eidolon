packages:
  - apps/*
  - packages/*

# `pnpm add`, and the shadcn CLI that runs it, write exact pins.
saveExact: true

# Only versions at least 3 hours old resolve, and every install checks the lockfile's against it.
minimumReleaseAge: 180

# Transitive CLI and build dependencies pull older undici ranges with open advisories.
overrides:
  undici: 7.30.2

# Whether a dependency's install script runs; pnpm fails an install that meets one not listed here.
allowBuilds:
  # Prebuilt bindings ship in @zvec/bindings-*; install.js only resolves the platform package.
  '@zvec/zvec': false
  # Squirrel.Windows' 7-Zip: electron-builder builds only the nsis target here.
  electron-winstaller: false
  # On linux/x64 it downloads the CUDA execution provider; the CPU binaries ship in the tarball.
  onnxruntime-node: false
  # Prebuilt binaries ship in @img/sharp-*; install only falls back to building from source.
  sharp: false
