name: TypeScript

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ts.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The parity tests that read a real persona index skip themselves: CI has no data home.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test
