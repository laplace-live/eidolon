name: Desktop spike

# Phase 0 of the desktop app, on the electron branch only (spikes/desktop/README.md): the Windows leg
# and one signed, notarized build, before Phase 1's desktop.yml exists. Throwaway, like the spike.
# It uploads evidence and the unsigned Windows installer only: the repository is public, so nothing
# signed leaves the runners.

on:
  push:
    branches: [electron]
    paths:
      - "spikes/desktop/**"
      - ".github/workflows/desktop-spike.yml"

permissions:
  contents: read

concurrency:
  group: desktop-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run build:npm

      - uses: actions/upload-artifact@v7
        with:
          name: eidolon-pack
          path: apps/eidolon/pack
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 90
    # Every script writes its evidence to spikes/desktop/.evidence.
    defaults:
      run:
        shell: bash
        working-directory: spikes/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The loopback fakes run on Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: eidolon-pack
          path: apps/eidolon/pack

      - name: Runner facts
        continue-on-error: true
        run: |
          mkdir -p .evidence
          {
            echo "## os"; cmd //c ver || true
            echo "## excluded TCP port ranges"; netsh int ipv4 show excludedportrange protocol=tcp || true
            echo "## Visual Studio"; "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -all -products '*' -format text | grep -E "^(displayName|installationVersion|installationPath)" || true
          } 2>&1 | tee .evidence/windows-runner.txt

      - name: Stage the backend payload
        run: node scripts/stage.mjs

      # No install scripts: electron-builder fetches Electron's own build, and nothing here needs one.
      - name: Install the spike's tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Bash, because PowerShell splits -c.compression=store into -c and a config path.
      - name: Package (unsigned)
        run: node node_modules/electron-builder/cli.js --win --x64 --publish never -c.compression=store -c.extraMetadata.version=0.0.0-dev

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-unsigned
          path: spikes/desktop/.out/*.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - id: install
        name: Install per user, silently (W1)
        run: node scripts/windows.mjs install .out --label unsigned

      - name: Walk the installed app (W2 to W6)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/checks.mjs --suite windows-installed --name installed

      - name: yt-dlp on the app's Node (W8, optional)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ytdlp.mjs --name installed

      - name: Uninstall silently (W7)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/windows.mjs uninstall --label unsigned --run installed

      - id: signed
        name: Package (signed)
        if: ${{ !cancelled() }}
        run: >-
          node node_modules/electron-builder/cli.js --win --x64 --publish never
          --config electron-builder.release.mjs -c.compression=store
          -c.extraMetadata.version=0.0.0-dev -c.directories.output=.out-signed
        env:
          # Azure Trusted Signing (electron-builder.release.mjs), under persona CI's names.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}

      - name: Signatures (S1)
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        run: node scripts/windows.mjs signatures .out-signed/win-unpacked --setup .out-signed --label signed

      - id: install-signed
        name: Install the signed build
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        run: node scripts/windows.mjs install .out-signed --label signed

      - name: Walk the signed build (S2)
        if: ${{ !cancelled() && steps.install-signed.outcome == 'success' }}
        run: node scripts/checks.mjs --suite windows-signed --name signed

      - name: Uninstall the signed build
        if: ${{ !cancelled() && steps.install-signed.outcome == 'success' }}
        run: node scripts/windows.mjs uninstall --label signed --run signed

      # The step scripts fail only when an install or uninstall didn't happen; this fails the job
      # for any check that did not pass.
      - name: Report
        if: always()
        run: node scripts/report.mjs windows

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-evidence
          path: spikes/desktop/.evidence
          include-hidden-files: true
          retention-days: 3

  macos:
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 90
    # Bash named explicitly for pipefail, which a step's default shell lacks.
    defaults:
      run:
        shell: bash
        working-directory: spikes/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: eidolon-pack
          path: apps/eidolon/pack

      - name: Runner facts
        continue-on-error: true
        run: |
          mkdir -p .evidence
          { sw_vers; uname -m; xcodebuild -version || true; say -v '?' | grep -iE "tingting|meijia" || echo "no Chinese say voice"; } 2>&1 | tee .evidence/macos-runner.txt

      - name: Stage the backend payload
        run: node scripts/stage.mjs

      - name: Install the spike's tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize the App Store Connect key
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      - id: package
        name: Package (signed and notarized)
        run: node node_modules/electron-builder/cli.js --mac --arm64 --publish never --config electron-builder.release.mjs -c.extraMetadata.version=0.0.0-dev
        env:
          # electron-builder imports the p12 into a temporary keychain itself; TMPDIR keeps that
          # keychain and the decoded certificate in RUNNER_TEMP.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TMPDIR: ${{ runner.temp }}

      # electron-builder notarizes and staples the app inside the DMG, not the DMG itself: record the
      # DMG as it came out, then notarize and staple it here.
      - name: Notarize and staple the DMG
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          dmg=$(ls .out/*.dmg)
          {
            echo "## the DMG as electron-builder left it"
            xcrun stapler validate "$dmg" || true
            codesign -dvvv "$dmg" || true
            echo "## notarytool"
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/apple-api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            echo "## stapler"
            xcrun stapler staple "$dmg"
          } 2>&1 | tee .evidence/mac-dmg-notarize.txt
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Signature, notarization, stapling (M1 to M5)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/mac-verify.mjs

      - name: Walk the signed app (M6)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/checks.mjs --suite mac-signed --name signed --app .out/mac-arm64/Eidolon.app/Contents/MacOS/Eidolon

      - name: Report
        if: always()
        run: node scripts/report.mjs macos

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-evidence
          path: spikes/desktop/.evidence
          include-hidden-files: true
          retention-days: 3
