# Labeled viewer turns for the retrieval gate; decisions.py scores them.
#
# recall = true  — a good reply needs facts about the streamer or her past
#                  streams that persona.md does not carry.
# recall = false — greetings, reactions, the viewer's own news, tool requests,
#                  general questions: persona.md alone answers them.
# No label       — borderline; reported, never scored.
#
# set = "dev"     — used to choose the questions and the threshold.
#       "heldout" — written before either was fixed, scored once.
#       "fresh"   — written after heldout exposed flower-shop lore as the
#                   weak spot, to check the one edit made in response.
#
# `before` holds earlier turns, alternating viewer / streamer, oldest first.

