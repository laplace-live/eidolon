# Labeled viewer turns for the gate's timeline questions; score.ts scores them.
#
# timeline = true  — the viewer asks when the streamer last or first did something, how long
#                    ago that was, or how many times she has done it.
# timeline = false — anything else, including questions about her latest broadcast, a dated
#                    broadcast, the future, or what rather than when.
# No label         — borderline; reported, never scored.
#
# set = "dev"     — used to choose the questions and the threshold.
#       "heldout" — written with dev, before any of them were scored; scored once.
#
# `before` holds earlier turns, alternating viewer / streamer, oldest first.

