name: Build

on:
  push:
    branches:
      - "master"
    # laplace-eidolon@<version>, pushed by release.yml (changesets) with the
    # release bot's token, so this trigger fires.
    tags:
      - "laplace-eidolon@*"
  pull_request:
    branches:
      - "master"
  repository_dispatch:
    types:
      - webhook
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # One image per runtime, both tagged alike, until the cutover retires Python.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ts
            image: ghcr.io/laplace-live/eidolon
            dockerfile: apps/bot/Dockerfile
          - name: python
            image: ghcr.io/laplace-live/eidolon-python
            dockerfile: Dockerfile

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v7
        with:
          # The prebuilt LanceDB tables under data/lancedb/**/*.lance are
          # stored in Git LFS (.gitattributes). Without lfs: true the
          # runner only checks out the pointer stubs, the Dockerfile's
          # `COPY ./data ./data` copies stubs into the image, and the
          # bot ships with empty RAG tables.
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ matrix.image }}
          tags: |
            type=edge
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=^laplace-eidolon@(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^laplace-eidolon@(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^laplace-eidolon@(\d+)\.\d+\.\d+$,group=1
            type=sha

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build-all
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.dockerfile=${{ matrix.dockerfile }}
            *.cache-from=type=gha,scope=${{ matrix.name }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.name }}
