name: TypeScript

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "tsconfig.scripts.json"
      - "tsconfig.no-bun.d.ts"
      - "vitest.config.ts"
      - "biome.json"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/settings.json"
      - ".github/workflows/ts.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "tsconfig.scripts.json"
      - "tsconfig.no-bun.d.ts"
      - "vitest.config.ts"
      - "biome.json"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/settings.json"
      - ".github/workflows/ts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The parity tests that read a real persona index skip themselves: CI has no data home.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The tests run on Node, as the local app, the CLI and the npm package do.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run build:web

      - run: bun run test

      # Production runs the same code on Bun.
      - run: bun apps/bot/scripts/bun-check.ts

  # The npm package as npx installs it, install scripts included, on a supported platform the Mac
  # it's built on can't run: Linux x64 with glibc.
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run pack:npm

      - run: node apps/eidolon/scripts/ci-install-check.ts apps/eidolon/*.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: apps/eidolon/*.tgz
          retention-days: 3

      - run: bun run pack:sdk

  # The same tarball on Windows x64, and the tests of what only Windows runs.
  windows:
    needs: npm-package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: apps/eidolon

      - run: node apps/eidolon/scripts/ci-install-check.ts apps/eidolon/*.tgz

      - run: >-
          bun run test packages/config/test/which.test.ts packages/config/test/process.test.ts
          packages/config/test/pypath.test.ts apps/eidolon/test/launcher.test.ts
          apps/bot/test/local/jobs-runner.test.ts

      - run: >-
          bun run test packages/assistant/test/shell.test.ts packages/assistant/test/mcp-stdio.test.ts
          packages/assistant/test/eidolon-command.test.ts packages/assistant/test/path.test.ts
          packages/assistant/test/bash-windows.test.ts packages/ingest/test/limit.test.ts -t Windows

      - run: bun run test apps/cli/test/cli.test.ts -t relayStopMessages
