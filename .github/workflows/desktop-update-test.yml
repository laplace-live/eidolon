name: Desktop update test

# The update test on one target, for desktop.yml's update_test dispatch: 0.0.1 and 0.0.2, each
# signed as a release is and reading a feed on loopback, then 0.0.1 installed and updated to 0.0.2
# through its real updater, in background mode, where each box takes its default button
# (scripts/update-test.ts). Neither can be an unsigned build: Squirrel.Mac installs only an update
# that meets the running app's designated requirement, and the NSIS updater only a setup signed by
# a name in app-update.yml's publisherName. Its own workflow, so a run gets its platform's secrets
# alone.

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      target:
        type: string
        required: true
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_CERTIFICATE_PROFILE_NAME:
        required: false

permissions:
  contents: read

jobs:
  update-test:
    name: Update test on ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    # Two signed builds, and on macOS two notarizations.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        timeout-minutes: 5

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24

      # As the build job installs: no package's install script runs before the signing step.
      - timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts

      - timeout-minutes: 20
        run: pnpm build:desktop

      - name: Materialize the App Store Connect key
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      # The release overlay, as the build job's signed step runs it, with this leg's secrets alone.
      # 0.0.1's outputs move out of .out, where signed-check reads 0.0.2's.
      - id: signed
        name: Package and sign 0.0.1, then 0.0.2
        timeout-minutes: 100
        working-directory: apps/desktop
        run: |
          package() {
            node node_modules/electron-builder/cli.js --publish never --config electron-builder.release.mjs \
              "-c.extraMetadata.version=$1" "-c.publish.url=$FEED_URL"
          }
          package 0.0.1
          mv .out "$RUNNER_TEMP/eidolon-update-0.0.1"
          package 0.0.2
        env:
          FEED_URL: http://127.0.0.1:8765/
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_CERTIFICATE_PROFILE_NAME || '' }}

      # Before any later step runs the app or its natives.
      - name: Remove the App Store Connect key
        if: always() && runner.os == 'macOS'
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: The signatures of 0.0.2
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        timeout-minutes: 15
        run: node apps/desktop/scripts/signed-check.ts

      - id: update
        name: The update from 0.0.1 to 0.0.2
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        timeout-minutes: 45
        run: node apps/desktop/scripts/update-test.ts "$RUNNER_TEMP/eidolon-update-0.0.1" apps/desktop/.out

      # Its profile's logs, the launch's output, the feed's requests, and the logs of the default
      # profile the update starts the app on again, with ShipIt's on macOS. Not its home, which
      # holds local-token.
      - name: Upload the failed update test's logs
        if: ${{ failure() && steps.update.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ${{ runner.os }}-update-test
          path: |
            ${{ runner.temp }}/eidolon-update-test-*/profile/logs
            ${{ runner.temp }}/eidolon-update-test-*/scratch
          retention-days: 7

      # Whatever a failed or cancelled run left installed: on Windows through its own uninstaller,
      # on macOS the copy the test updated.
      - name: Clean up
        if: always()
        timeout-minutes: 5
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            uninstaller="$(cygpath -u "$LOCALAPPDATA")/Programs/eidolon/Uninstall LAPLACE Eidolon.exe"
            # Git Bash would hand a native program /S as a path.
            if [[ -f $uninstaller ]]; then MSYS_NO_PATHCONV=1 "$uninstaller" /S /currentuser; fi
          else
            rm -rf "$RUNNER_TEMP"/eidolon-update-test-*/Applications
          fi
