# Soniox transcription context — biases the Soniox STT model toward this
# project's vocabulary (persona names, audience slang, recurring topics).
# Loaded automatically by `laplace-transcribe` and `laplace-pipeline`.
#
# Schema mirrors Soniox's StructuredContext exactly:
#   https://soniox.com/docs/stt/concepts/context
#
# Sections (all optional):
#   text               — long-form background paragraph. Use sparingly.
#   terms              — flat list of strings. The high-impact section.
#   general            — list of {key, value} dicts. Domain, topic, names.
#   translation_terms  — list of {source, target}. Only used if you ever
#                        run Soniox in translation mode (we don't today).
#
# Limits enforced by Soniox:
#   - Max ~8000 tokens (~10,000 characters) total across all sections.
#   - Keep `general` to ≤10 short key/value pairs.
#   - `terms` works best as distinct words/phrases, not full sentences.
#
# Per-run overrides:
#   - For a one-off glossary (e.g. a brand-new game premiere with proper
#     nouns this file doesn't know about) use:
#       --context-file my_other_glossary.toml
#   - For a clean A/B run with no context at all:
#       --no-context
#
# We deliberately do NOT pass a per-stream "topic" hint. A single VOD often
# spans chat, gaming, karaoke, and watchalongs, so a single label would be
# misleading. Per-scene topics live on each chunk after `laplace-refine`.
#
# TOML gotcha: top-level scalars/arrays (`text`, `terms`) MUST appear
# before any `[[general]]` / `[[translation_terms]]` array-of-tables
# blocks below, or TOML will silently nest them inside the last table.
#
# THIS FILE IS A PLACEHOLDER. Replace `terms` and `text` with your real
# glossary when you have one — that's where the accuracy gains live.

# ─────────────────────────────────────────────────────────────────────────
# Text — long-form background. Lower influence than `terms`; reserve for
# setting and lore the model can't easily guess from a glossary.
# ─────────────────────────────────────────────────────────────────────────

