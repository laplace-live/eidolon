# Self-host laplace-eidolon in one command:
#
#   docker compose up --build
#
# Then point a browser at http://localhost:7860/client (the prebuilt
# Pipecat demo UI ships inside the runner; replace later with the
# custom UI in ./frontend/ which will signal via POST /api/offer).
#
# For production, put this behind a TLS-terminating reverse proxy
# (Caddy / nginx / Traefik). WebRTC's getUserMedia requires HTTPS on
# anything that isn't localhost, and Pipecat's SmallWebRTC signaling
# is plain HTTP under the hood, so the proxy must forward POST /api/offer
# and PATCH /api/offer end-to-end without buffering.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: laplace-eidolon
    container_name: laplace-eidolon
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - ./.env
    ports:
      - "7860:7860"
    volumes:
      # Mem0's change log. Everything else under data/ ships in the image.
      - mem0-history:/app/data/mem0
    # If you want to ingest LanceDB indexes on the host and have them
    # picked up live (without rebuilding the image), uncomment:
    #   - ./data:/app/data:ro
    #   - ./streams:/app/streams:ro
    #   - ./persona.md:/app/persona.md:ro

  # The TypeScript bot, beside the Python one: same .env, same Qdrant collection, its own
  # port and Mem0 history volume. Opt-in, so `docker compose up --build` still builds and
  # runs only the Python bot:
  #
  #   docker compose --profile ts up --build
  bot-ts:
    profiles: ["ts"]
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: laplace-eidolon-ts
    container_name: laplace-eidolon-ts
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - ./.env
    ports:
      - "7861:7860"
    volumes:
      - mem0-history-ts:/app/data/mem0

  # Long-term memory vectors. Mem0 itself is a library inside the bot —
  # this is the only piece that runs as its own process. Set
  # MEM0_QDRANT_HOST in .env to enable memory (`qdrant` from the bot
  # container, `localhost` when debugging the bot on the host); leave it
  # blank and the bot runs without memory.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    # Loopback only — Qdrant ships with no authentication. The port is
    # published at all so `docker compose up -d qdrant` backs a bot run
    # from the host with `python -m laplace_eidolon.bot`.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
  mem0-history:
  mem0-history-ts:
