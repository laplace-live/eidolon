[project]
name = "laplace-eidolon"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.10"
dependencies = [
    # SmallWebRTC only — no Daily, no telephony. Self-hosted via Docker
    # behind the user's own reverse proxy / TLS termination.
    "pipecat-ai[fish,mem0,openrouter,runner,silero,soniox,webrtc]",
    # Stream archive (RAG over past stream transcripts)
    "lancedb>=0.27.1",
    "pyarrow>=22",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
# Tooling for local-only operations (transcription, ingest). Not needed at
# runtime by the bot. Install with: uv sync --extra tools
tools = [
    "faster-whisper>=1.2.0",
    "soniox>=1.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
