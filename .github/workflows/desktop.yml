name: Desktop

# The desktop app (apps/desktop) built, packaged and checked on each target it ships for; from a
# laplace-eidolon-desktop@<version> tag, signed, notarized and uploaded to R2 (docs/desktop.md,
# Releasing). Its payload comes from bun.lock and the backend's packages, so a change to either runs
# this too.

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Pushed by release.yml (changesets) with the release bot's token, so this trigger fires.
  push:
    tags:
      - "laplace-eidolon-desktop@*"
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the build, on master or electron only. Its installers are kept a day
        type: boolean
        default: false
      version:
        description: With sign, the version to build, as X.Y.Z (else 0.0.0-dev)
        type: string
        default: ""
      feed_url:
        description: With sign, the update feed the build reads instead of R2's, such as http://127.0.0.1:8765/
        type: string
        default: ""
      r2_probe:
        description: Only put, head and delete a probe object in R2 with the upload's credentials, on master or electron only
        type: boolean
        default: false
      release_index:
        description: Only rebuild eidolon/releases.json from R2's listing, on master or electron only
        type: boolean
        default: false
      update_test:
        description: Only build 0.0.1 and 0.0.2 signed and update one to the other through the real updater, on master or electron only
        type: boolean
        default: false

permissions:
  contents: read

# A push to a pull request cancels the run it supersedes. A tag's run is the release and is never
# cancelled. A dispatch neither waits nor cancels, so two signed dispatches from one branch both
# finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.target }}
    # A dispatch that only probes R2, rebuilds its index or runs the update test builds nothing here.
    if: github.event_name != 'workflow_dispatch' || !(inputs.r2_probe || inputs.release_index || inputs.update_test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    # Bash on Windows too: PowerShell splits -c.compression=store into -c and a config path.
    defaults:
      run:
        shell: bash
    env:
      # A tag, or a dispatch with sign on master or electron: in this public repository any signed-in
      # user can download a run's artifacts, so no other ref gets a signed build.
      SIGNED: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.sign && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/electron')) }}
    steps:
      # A tag's run fetches the history, so the tag check finds origin/master.
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      # Without it, any token that can push a tag could ship a signed release from any commit.
      - name: Check the tag
        if: github.event_name == 'push'
        timeout-minutes: 5
        run: |
          version="${GITHUB_REF_NAME#laplace-eidolon-desktop@}"
          manifest=$(node -p 'require("./apps/desktop/package.json").version')
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, which isn't on master"
            exit 1
          fi
          if [[ $version != "$manifest" ]]; then
            echo "::error::$GITHUB_REF_NAME names $version, but apps/desktop/package.json is at $manifest"
            exit 1
          fi

      # A plain X.Y.Z, since electron-builder takes a prerelease id for the update channel, and the
      # update test's feed serves latest*.yml.
      - name: Check the dispatch's inputs
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [[ ($VERSION != "" || $FEED_URL != "") && $SIGN != true ]]; then
            fail "version and feed_url are for a signed build: dispatch with sign"
          fi
          if [[ $SIGN == true && $SIGNED != true ]]; then
            fail "sign runs only on master or electron, not $GITHUB_REF"
          fi
          if [[ $VERSION != "" && ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "version must be X.Y.Z, not $VERSION"
          fi
          if [[ $FEED_URL != "" && ! $FEED_URL =~ ^https?:// ]]; then
            fail "feed_url must be an http or https URL, not $FEED_URL"
          fi
        env:
          SIGN: ${{ inputs.sign }}
          VERSION: ${{ inputs.version }}
          FEED_URL: ${{ inputs.feed_url }}

      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24

      # As release.yml installs: no build step needs a package's install script, and one could
      # rewrite the electron-builder the signing step runs with the secrets.
      - id: install
        timeout-minutes: 10
        run: bun install --frozen-lockfile --ignore-scripts

      # Stages this target's backend in apps/desktop/.stage, then builds main, the preload and the
      # shell pages.
      - id: build
        timeout-minutes: 20
        run: bun run build:desktop

      # Unsigned, at 0.0.0-dev: ad hoc on macOS and never with a keychain identity
      # (scripts/package.ts), NSIS on Windows.
      - id: package
        if: env.SIGNED != 'true'
        timeout-minutes: 20
        run: bun run package:desktop -c.compression=store

      # electron-builder's notarization reads the App Store Connect key from a file.
      - name: Materialize the App Store Connect key
        if: env.SIGNED == 'true' && runner.os == 'macOS'
        timeout-minutes: 1
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      # The release overlay over the base config: a tag builds the manifest's version, a dispatch the
      # one it names, else 0.0.0-dev. Each leg gets its own platform's secrets alone.
      - id: signed
        name: Package (signed)
        if: env.SIGNED == 'true'
        timeout-minutes: 45
        working-directory: apps/desktop
        run: |
          args=(--publish never --config electron-builder.release.mjs)
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            args+=("-c.extraMetadata.version=${VERSION:-0.0.0-dev}")
            if [[ -n $FEED_URL ]]; then args+=("-c.publish.url=$FEED_URL"); fi
          fi
          node node_modules/electron-builder/cli.js "${args[@]}"
        env:
          VERSION: ${{ inputs.version }}
          FEED_URL: ${{ inputs.feed_url }}
          # macOS: electron-builder imports the certificate into a temporary keychain itself. CSC_* is
          # macOS-only because Windows falls back to it for signtool.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          # Windows: Azure Trusted Signing (electron-builder.release.mjs).
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_CERTIFICATE_PROFILE_NAME || '' }}

      # Before any later step runs the app or its natives.
      - name: Remove the App Store Connect key
        if: always() && env.SIGNED == 'true' && runner.os == 'macOS'
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      # macOS: codesign, Gatekeeper, the stapled ticket, the natives' hardened runtime and timestamp
      # and each bundle's designated requirement. Windows: the setup installed, Authenticode on every
      # PE file of the install and on the setup, then uninstalled.
      - name: The signatures
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        timeout-minutes: 15
        run: node apps/desktop/scripts/signed-check.ts

      # What the payload holds, pinned to bun.lock; its natives loading from it; on Windows the VC++
      # runtime beside them and every DLL signed by Microsoft or listed to sign; and, packaged after
      # it, the app holding it file for file.
      - name: The staged payload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: bun run test apps/desktop/test/stage.test.ts
        env:
          EIDOLON_REQUIRE_STAGE: "1"

      - name: The backend's tests on Electron's Node
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: node apps/desktop/scripts/test-on-electron.ts

      # The whole suite doesn't run on Windows: these are the tests ts.yml's windows job runs there.
      - name: Windows' own tests on Electron's Node
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 20
        run: |
          node apps/desktop/scripts/test-on-electron.ts packages/config/test/which.test.ts \
            packages/config/test/process.test.ts packages/config/test/pypath.test.ts \
            apps/eidolon/test/launcher.test.ts apps/bot/test/local/jobs-runner.test.ts
          node apps/desktop/scripts/test-on-electron.ts packages/assistant/test/shell.test.ts \
            packages/assistant/test/mcp-stdio.test.ts packages/assistant/test/eidolon-command.test.ts \
            packages/assistant/test/path.test.ts packages/assistant/test/bash-windows.test.ts \
            packages/ingest/test/limit.test.ts \
            -t "Windows|its children, when the host exits without closing it"
          node apps/desktop/scripts/test-on-electron.ts apps/cli/test/cli.test.ts -t relayStopMessages

      # The packaged app in apps/desktop/.out on a temporary data home and profile, driven through
      # its backend's API, with no window shown. On Windows it installs the NSIS setup silently
      # first and uninstalls it after.
      - id: smoke
        name: The packaged smoke
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.signed.outcome == 'success') }}
        timeout-minutes: 15
        run: bun run smoke:desktop
        env:
          EIDOLON_DESKTOP_BACKGROUND: "1"

      # A failed run keeps its folder: its results, the app's logs and its launches' output. Not
      # its home, which holds local-token, nor the rest of its profile.
      - name: Upload the failed smoke's logs
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ${{ runner.os }}-smoke-desktop
          path: |
            ${{ runner.temp }}/eidolon-smoke-desktop-*/results.json
            ${{ runner.temp }}/eidolon-smoke-desktop-*/profile/logs
            ${{ runner.temp }}/eidolon-smoke-desktop-*/scratch
          retention-days: 7

      # Adds a throwaway CA to this runner's trust store, and deletes the certificate after.
      - name: "--use-system-ca on the packaged binary"
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.signed.outcome == 'success') }}
        timeout-minutes: 10
        run: node apps/desktop/scripts/system-ca.ts

      # Not the macOS zip, which only updates read: a dev build takes none. upload-artifact skips a
      # hidden folder such as .out unless told.
      - name: Upload the installers
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: ${{ runner.os }}-installers-dev
          path: |
            apps/desktop/.out/*.dmg
            apps/desktop/.out/*.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # Only once every check passed: a tag's, which the upload job sends to R2, or a signed
      # dispatch's, for the update test and never to R2.
      - name: Upload the signed installers
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v7
        timeout-minutes: 15
        with:
          name: ${{ runner.os }}-installers${{ github.event_name != 'push' && '-signed-unreleased' || '' }}
          path: |
            apps/desktop/.out/*.dmg
            apps/desktop/.out/*.zip
            apps/desktop/.out/*.exe
            apps/desktop/.out/*.blockmap
            apps/desktop/.out/latest*.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}

  # Its own job, after both legs: a re-run sends the very bytes the build signed, where a re-run of a
  # leg would sign new ones.
  upload:
    name: Upload to R2
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # The tagged commit's changelog.json, and the script that takes the update dialog's notes
      # from it.
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        timeout-minutes: 10
        with:
          name: macOS-installers
          path: release

      - uses: actions/download-artifact@v8
        timeout-minutes: 10
        with:
          name: Windows-installers
          path: release

      # Every installer and blockmap once, under eidolon/v<version>/, which is never deleted or
      # overwritten: clients download from there, Cloudflare would keep serving a first copy, and
      # electron-updater rejects other bytes on their checksum. Then the manifests, url: and path:
      # pointed into v<version>/ (electron-updater resolves both, and the old blockmap it derives
      # from them, against the manifest's URL) and the notes appended: v<version>/'s copies, then
      # flat eidolon/'s, which installs read. Then the download links, and changelog.json.
      - name: Upload to R2
        timeout-minutes: 25
        run: |
          version="${GITHUB_REF_NAME#laplace-eidolon-desktop@}"
          notes=$(node scripts/changelog.ts manifest)
          s3() {
            aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$R2_ENDPOINT" --cache-control "$3" \
              --only-show-errors "${@:4}"
          }
          # A re-run finds its own bytes there by the SHA-256 the first run stored with them.
          put_once() {
            local sum found
            sum=$(sha256sum "$1" | cut -d ' ' -f 1)
            if found=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$2" \
              --endpoint-url "$R2_ENDPOINT" --query Metadata.sha256 --output text 2>&1); then
              if [[ $found != "$sum" ]]; then
                echo "::error::$2 is already in R2 with other bytes (sha256 $found, not $sum)"
                return 1
              fi
              echo "$2 is already in R2, the same bytes"
            elif [[ $found == *"(404)"* ]]; then
              s3 "$1" "$2" 'public, max-age=31536000, immutable' --metadata "sha256=$sum"
            else
              echo "$found"
              return 1
            fi
          }
          cd release
          # A pattern that matches nothing would otherwise upload nothing and pass.
          shopt -s nullglob
          installers=(*.dmg *.zip *.exe *.blockmap)
          dmg=(*.dmg)
          setup=(*.exe)
          manifests=(latest-mac.yml latest.yml)
          for name in "${manifests[@]}"; do
            [[ -f $name ]] || { echo "::error::no $name among: ${installers[*]}"; exit 1; }
          done
          if (( ${#dmg[@]} != 1 || ${#setup[@]} != 1 )); then
            echo "::error::expected one DMG and one setup, found: ${installers[*]}"
            exit 1
          fi
          for file in "${installers[@]}"; do put_once "$file" "$R2_PREFIX/v$version/$file"; done
          mkdir -p feed
          for name in "${manifests[@]}"; do
            { sed -E "s#^([[:space:]]*(- )?(url|path): )#\1v$version/#" "$name"; printf '%s\n' "$notes"; } \
              > "feed/$name"
            s3 "feed/$name" "$R2_PREFIX/v$version/$name" no-cache
          done
          for name in "${manifests[@]}"; do s3 "feed/$name" "$R2_PREFIX/$name" no-cache; done
          s3 "${dmg[0]}" "$R2_PREFIX/Eidolon-mac-arm64.dmg" no-cache
          s3 "${setup[0]}" "$R2_PREFIX/Eidolon-win-x64.exe" no-cache
          s3 ../changelog.json "$R2_PREFIX/changelog.json" no-cache --content-type application/json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the AWS CLI's default streaming checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: downloads
          R2_PREFIX: eidolon

  # eidolon/releases.json, the website's version history, rebuilt from a bucket listing rather than
  # appended to, so nothing ever needs a backfill. always(): after a failed leg or upload it lists
  # what R2 holds.
  release-index:
    name: releases.json
    needs: upload
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_index))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ $GITHUB_REF != refs/heads/master && $GITHUB_REF != refs/heads/electron ]]; then
            echo "::error::release_index runs only on master or electron, not $GITHUB_REF"
            exit 1
          fi

      # Installers are everything under v<version>/ but blockmaps and manifests; their url fields
      # match the manifests', relative to eidolon/.
      - name: Publish releases.json
        timeout-minutes: 5
        run: |
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$R2_PREFIX/v" --endpoint-url "$R2_ENDPOINT" --output json \
            | jq -c --arg prefix "$R2_PREFIX/" '{
                schema: 1,
                releases: [
                  (.Contents // [])[]
                  | (.Key | ltrimstr($prefix)) as $url
                  | select($url | test("\\.(blockmap|yml)$") | not)
                  | { version: ($url | split("/")[0] | ltrimstr("v")), url: $url, size: .Size,
                      date: (.LastModified[:19] + "Z") }
                ]
                | group_by(.version)
                | map({ version: .[0].version, releaseDate: (map(.date) | min), files: map({ url, size }) })
                | sort_by(.version | split(".") | map(tonumber))
                | reverse
              }' > releases.json
          aws s3 cp releases.json "s3://$R2_BUCKET/$R2_PREFIX/releases.json" --endpoint-url "$R2_ENDPOINT" \
            --cache-control no-cache --content-type application/json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: downloads
          R2_PREFIX: eidolon

  # The upload's credentials and calls on one object, before a release first needs them: the put with
  # its SHA-256, the head that guards an installer, and a delete.
  r2-probe:
    name: R2 probe
    if: github.event_name == 'workflow_dispatch' && inputs.r2_probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the ref
        run: |
          if [[ $GITHUB_REF != refs/heads/master && $GITHUB_REF != refs/heads/electron ]]; then
            echo "::error::r2_probe runs only on master or electron, not $GITHUB_REF"
            exit 1
          fi

      - name: Put, head and delete eidolon/.probe-<run id>
        timeout-minutes: 5
        run: |
          key="$R2_PREFIX/.probe-$GITHUB_RUN_ID"
          stored() {
            aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" \
              --query Metadata.sha256 --output text 2>&1
          }
          remove() {
            aws s3api delete-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" > /dev/null
          }
          printf 'probe %s\n' "$GITHUB_RUN_ID" > probe.txt
          sum=$(sha256sum probe.txt | cut -d ' ' -f 1)
          aws s3 cp probe.txt "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --cache-control no-cache \
            --only-show-errors --metadata "sha256=$sum"
          # A failed head leaves no probe behind in the public bucket.
          trap 'remove || true' EXIT
          found=$(stored)
          if [[ $found != "$sum" ]]; then
            echo "::error::head-object read sha256 $found back, not $sum"
            exit 1
          fi
          remove
          if found=$(stored); then
            echo "::error::$key is still there after the delete"
            exit 1
          fi
          if [[ $found != *"(404)"* ]]; then
            echo "::error::$found"
            exit 1
          fi
          echo "R2: put, head and delete passed on $key"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: downloads
          R2_PREFIX: eidolon

  # 0.0.1 and 0.0.2, each signed as a release is and reading a feed on loopback, then 0.0.1 installed
  # and updated to 0.0.2 through its real updater, in background mode, where each box takes its
  # default button (scripts/update-test.ts). Neither can be an unsigned build: Squirrel.Mac installs
  # only an update that meets the running app's designated requirement, and the NSIS updater only a
  # setup signed by a name in app-update.yml's publisherName.
  update-test:
    name: Update test on ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' && inputs.update_test
    runs-on: ${{ matrix.os }}
    # Two signed builds, and on macOS two notarizations.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    defaults:
      run:
        shell: bash
    steps:
      # Before any secret is read: any signed-in user can download a run's artifacts here, so only
      # master and electron build signed.
      - name: Check the ref and the inputs
        timeout-minutes: 1
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [[ $GITHUB_REF != refs/heads/master && $GITHUB_REF != refs/heads/electron ]]; then
            fail "update_test runs only on master or electron, not $GITHUB_REF"
          fi
          if [[ $SIGN == true || $VERSION != "" || $FEED_URL != "" ]]; then
            fail "update_test builds its own 0.0.1 and 0.0.2 on its own feed: dispatch it without sign, version or feed_url"
          fi
        env:
          SIGN: ${{ inputs.sign }}
          VERSION: ${{ inputs.version }}
          FEED_URL: ${{ inputs.feed_url }}

      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24

      # As the build job installs: no package's install script runs before the signing step.
      - timeout-minutes: 10
        run: bun install --frozen-lockfile --ignore-scripts

      - timeout-minutes: 20
        run: bun run build:desktop

      - name: Materialize the App Store Connect key
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      # The release overlay, as the build job's signed step runs it, with this leg's secrets alone.
      # 0.0.1's outputs move out of .out, where signed-check reads 0.0.2's.
      - id: signed
        name: Package and sign 0.0.1, then 0.0.2
        timeout-minutes: 100
        working-directory: apps/desktop
        run: |
          package() {
            node node_modules/electron-builder/cli.js --publish never --config electron-builder.release.mjs \
              "-c.extraMetadata.version=$1" "-c.publish.url=$FEED_URL"
          }
          package 0.0.1
          mv .out "$RUNNER_TEMP/eidolon-update-0.0.1"
          package 0.0.2
        env:
          FEED_URL: http://127.0.0.1:8765/
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_CERTIFICATE_PROFILE_NAME || '' }}

      # Before any later step runs the app or its natives.
      - name: Remove the App Store Connect key
        if: always() && runner.os == 'macOS'
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: The signatures of 0.0.2
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        timeout-minutes: 15
        run: node apps/desktop/scripts/signed-check.ts

      - id: update
        name: The update from 0.0.1 to 0.0.2
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        timeout-minutes: 45
        run: node apps/desktop/scripts/update-test.ts "$RUNNER_TEMP/eidolon-update-0.0.1" apps/desktop/.out

      # Its profile's logs, the launch's output, the feed's requests, and the logs of the default
      # profile the update starts the app on again, with ShipIt's on macOS. Not its home, which
      # holds local-token.
      - name: Upload the failed update test's logs
        if: ${{ failure() && steps.update.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: ${{ runner.os }}-update-test
          path: |
            ${{ runner.temp }}/eidolon-update-test-*/profile/logs
            ${{ runner.temp }}/eidolon-update-test-*/scratch
          retention-days: 7

      # Whatever a failed or cancelled run left installed: on Windows through its own uninstaller,
      # on macOS the copy the test updated.
      - name: Clean up
        if: always()
        timeout-minutes: 5
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            uninstaller="$(cygpath -u "$LOCALAPPDATA")/Programs/eidolon/Uninstall Eidolon.exe"
            # Git Bash would hand a native program /S as a path.
            if [[ -f $uninstaller ]]; then MSYS_NO_PATHCONV=1 "$uninstaller" /S /currentuser; fi
          else
            rm -rf "$RUNNER_TEMP"/eidolon-update-test-*/Applications
          fi
