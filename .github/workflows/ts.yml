name: TypeScript

on:
  push:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "scripts/**"
      - ".changeset/changelog.mjs"
      - "changelog.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "biome.json"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/settings.json"
      - ".github/workflows/ts.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "apps/**"
      - "packages/**"
      - "personas/**"
      - "scripts/**"
      - ".changeset/changelog.mjs"
      - "changelog.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "biome.json"
      - "AGENTS.md"
      - "docs/**"
      - ".claude/settings.json"
      - ".github/workflows/ts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The parity tests that read a real persona index skip themselves: CI has no data home.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build:web

      - run: pnpm test

  # The npm package as npx installs it, install scripts included, on a supported platform the Mac
  # it's built on can't run: Linux x64 with glibc.
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm pack:npm

      - run: node apps/eidolon/scripts/ci-install-check.ts apps/eidolon/*.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: apps/eidolon/*.tgz
          retention-days: 3

      - run: pnpm pack:sdk

  # The same tarball on Windows x64, and the tests of what only Windows runs.
  windows:
    needs: npm-package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: apps/eidolon

      - run: node apps/eidolon/scripts/ci-install-check.ts apps/eidolon/*.tgz

      - run: >-
          pnpm test packages/config/test/which.test.ts packages/config/test/process.test.ts
          packages/config/test/pypath.test.ts apps/eidolon/test/launcher.test.ts
          apps/bot/test/local/jobs-runner.test.ts

      - run: >-
          pnpm test packages/assistant/test/shell.test.ts packages/assistant/test/mcp-stdio.test.ts
          packages/assistant/test/eidolon-command.test.ts packages/assistant/test/path.test.ts
          packages/assistant/test/bash-windows.test.ts packages/ingest/test/limit.test.ts
          -t "Windows|its children, when the host exits without closing it"

      - run: pnpm test apps/cli/test/cli.test.ts -t relayStopMessages

      # The desktop app's own: its PATH and registry scripts on scratch keys under HKCU, the .cmd
      # launchers of its terminal command and node shim, and the shim's npx through cmd.exe.
      - run: >-
          pnpm test apps/desktop/test/terminal-command-windows.test.ts
          apps/desktop/test/registry-environment-windows.test.ts
          apps/desktop/test/node-shim-windows.test.ts
          apps/desktop/test/npx-windows.test.ts
